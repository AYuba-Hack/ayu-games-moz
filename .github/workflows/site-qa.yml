name: QA do site (desktop e mobile)

on:
  push:
    branches:
      - qa-lancamento
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navegador-e-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: |
          npm install --no-save @playwright/test@1.56.1
          google-chrome --version
          echo 'Chromium com emulação Pixel 7 e Desktop Chrome'
      - name: Executar testes responsivos e funcionais
        run: npx playwright test --config=.github/tests/playwright.config.cjs
      - name: Criar ZIP da versao validada
        if: success()
        run: |
          mkdir -p qa-report
          git archive --format=zip --output=qa-report/AYU-Games-MOZ-FINAL.zip HEAD
          echo "Versao do AYU Games MOZ testada com Playwright, Chromium Desktop e Pixel 7." > qa-report/LEIA-ME-RESULTADO.txt
          echo "Commit: ${GITHUB_SHA}" >> qa-report/LEIA-ME-RESULTADO.txt
          echo "Publicacao: Cloudflare Pages integrado ao GitHub." >> qa-report/LEIA-ME-RESULTADO.txt
          echo "O Search Console e AdSense exigem verificacao nas contas do proprietario." >> qa-report/LEIA-ME-RESULTADO.txt
      - name: Guardar relatório, imagens e vídeos de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-qa-${{ github.sha }}
          path: |
            qa-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
